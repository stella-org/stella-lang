name: CI

on:
  push:
    branches:
      - "**"
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.filter.outputs.code }}
      example: ${{ steps.filter.outputs.example }}
    steps:
      - uses: actions/checkout@v5
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            code:
              - 'compiler/**'
              - 'e2e/**'
              - 'backend-js/**'
              - 'cli/**'
              - 'steam/**'
              - 'stellac/**'
              - 'js-runtime/**'
              - 'fixtures/**'
              - 'stella-packages/**'
              - 'scripts/**'
              - 'package.json'
              - 'package-lock.json'
              - 'spago.yaml'
              - 'spago.lock'
              - 'flake.nix'
              - 'flake.lock'
              - '.github/workflows/ci.yaml'

  ci:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: cachix/install-nix-action@v30
        with:
          extra_nix_config: experimental-features = nix-command flakes
      - uses: cachix/cachix-action@v17
        with:
          name: stella-org-gh
          authToken: "${{ secrets.CACHIX_AUTH_TOKEN }}"
      - uses: nicknovitski/nix-develop@v1

      # the workspace packages, @stella-lang/runtime among them, which Steam and the
      # implementations its tests load both import
      - name: Install
        run: npm ci

      - name: Build
        run: |
          for package in compiler cli steam backend-js stellac e2e; do
            spago build -p "$package" --strict --pure --pedantic-packages
          done

      # The end-to-end suite checks that fixtures/bytecode is exactly what building
      # its source gives now, so it runs before the suites that read those bytes,
      # Steam's and the JavaScript backend's, and a stale fixture fails in it,
      # naming itself, rather than passing in those. Regenerate with
      # STELLA_UPDATE_FIXTURES=1 spago test -p e2e.
      # The tests over a child process or a session's protocol are a suite of their
      # own in e2e and stellac, each run here as every change's; those over inputs
      # as deep and as long as stack safety is tested at are the Stress workflow's.
      - name: Test
        run: |
          spago test -p compiler --pure
          spago test -p cli --pure
          spago test -p e2e --pure
          spago test -p e2e -m Test.E2E.Integration --pure
          spago test -p steam --pure
          spago test -p stellac --pure
          spago test -p stellac -m Test.Stellac.Integration --pure
          spago test -p backend-js --pure

      - name: Format check
        run: git ls-files '*.purs' ':(exclude)docs/**' | xargs purs-tidy check

  ci-gate:
    needs: [changes, ci]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Gate on the results
        run: |
          changes='${{ needs.changes.result }}'
          if [ "$changes" != "success" ]; then
            echo "::error::changes did not pass (result: $changes)"
            exit 1
          fi

          code='${{ needs.changes.outputs.code }}'
          ci='${{ needs.ci.result }}'

          if [ "$code" = "true" ] && [ "$ci" != "success" ]; then
            echo "::error::ci did not pass (result: $ci)"
            exit 1
          fi

          echo "CI gate green (code=$code ci=$ci)"
